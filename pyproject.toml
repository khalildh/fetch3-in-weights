[project]
name = "fetch3-in-weights"
version = "0.2.0"
description = "A text-mode browser compiled into circuit weights, evaluated with exact integer arithmetic"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fetch3_browser"]

[project.scripts]
fetch3-demo = "fetch3_browser.demo:main"
